<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="GMR curated AI knowledge content distribution dashboard" />
  <title>Content Distribution by Category</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="dashboard" aria-label="Content distribution by category">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="network" aria-hidden="true"></div>

    <section class="content">
      <header class="hero">
        <h1>CONTENT DISTRIBUTION BY CATEGORY</h1>
        <p>Curated AI knowledge — updated every Monday</p>
      </header>

      <section id="categoryGrid" class="category-grid" aria-label="Content categories"></section>

      <footer class="footer-note">
        <span>Content is selected, verified, and refreshed from multiple trusted sources, including LinkedIn, AI news platforms, and industry-leading publications.</span>
      </footer>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
